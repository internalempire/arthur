name: tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Select verification profile
        id: profile
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "profile=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          saw_docs=false
          saw_ui=false
          profile=docs
          while IFS= read -r file; do
            case "$file" in
              README.md|*.md|manual/manifest.json|manual/status.json)
                saw_docs=true
                ;;
              index.html|styles/*|src/ui/*)
                saw_ui=true
                ;;
              *)
                profile=full
                break
                ;;
            esac
          done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          if [[ "$profile" != "full" ]]; then
            if [[ "$saw_docs" == "true" && "$saw_ui" == "true" ]]; then
              profile=docs-ui
            elif [[ "$saw_ui" == "true" ]]; then
              profile=ui
            else
              profile=docs
            fi
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "Selected $profile verification"
      # No dependencies to install: the model is plain ES modules and the test
      # runner is Node's own. `npm ci` would fail for want of a lockfile.
      - name: Syntax check every module
        run: find src tests -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: UI smoke contracts
        if: steps.profile.outputs.profile == 'ui' || steps.profile.outputs.profile == 'docs-ui'
        run: npm run test:ui
      - name: Full model and documentation tests
        if: steps.profile.outputs.profile == 'full'
        run: node tests/run.mjs
      - name: Build generated manual indexes
        if: steps.profile.outputs.profile != 'ui'
        run: npm run manual:build && git diff --exit-code
      - name: Validate manual
        if: steps.profile.outputs.profile != 'ui'
        run: npm run manual:lint
