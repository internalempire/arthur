<line class="grid" x1="66" y1="61.2" x2="560" y2="61.2"/><text class="tick" x="57" y="65.2" text-anchor="end">100</text>
<text class="tick" x="142.0" y="396" text-anchor="middle">10</text>
<text class="tick" x="237.0" y="396" text-anchor="middle">15</text>
<text class="tick" x="332.0" y="396" text-anchor="middle">20</text>
<text class="tick" x="427.0" y="396" text-anchor="middle">25</text>
<text class="tick" x="522.0" y="396" text-anchor="middle">30</text>
<line class="axis" x1="66" y1="26" x2="66" y2="378"/>
<line class="axis" x1="66" y1="378.0" x2="560" y2="378.0"/>
<path class="total" style="stroke-dasharray:none" d="M136.4 325.4 L164.5 299.6 L191.3 270.0 L217.0 237.5 L242.0 203.4 L291.2 138.2 L343.1 90.4 L400.4 68.7 L461.3 62.8 L523.5 61.5"/>
<path class="alv" style="stroke-dasharray:none" d="M523.5 61.5 L461.0 61.5 L398.5 61.5 L336.1 61.5 L274.0 62.5 L212.8 67.7 L183.1 75.1 L154.6 89.4 L127.7 113.7 L102.7 149.4"/>
