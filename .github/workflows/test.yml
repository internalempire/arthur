name: tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the complete checkout
        env:
          ARTHUR_AUDIT_REPORT: ${{ runner.temp }}/arthur-audit.json
        run: node tools/verify.mjs
      - name: Preserve independent audit measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-audit
          path: ${{ runner.temp }}/arthur-audit.json
          if-no-files-found: error
