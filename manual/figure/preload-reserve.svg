<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" class="arthur-fig" role="img" aria-label="Preload reserve is the local gain in output when filling pressure rises">
<style>
  svg.arthur-fig .bg { fill: none }
  svg.arthur-fig .axis { stroke: var(--fig-axis, #9aa4b2); stroke-width: 1 }
  svg.arthur-fig .grid { stroke: var(--fig-grid, #d7dce3); stroke-width: 1; stroke-dasharray: 2 4 }
  svg.arthur-fig .tick { fill: var(--fig-muted, #6b7480); font: 11px system-ui, sans-serif }
  svg.arthur-fig .label { fill: var(--fig-text, #2b3138); font: 12px system-ui, sans-serif }
  svg.arthur-fig .title { fill: var(--fig-text, #2b3138); font: 600 13px system-ui, sans-serif }
  svg.arthur-fig .lm { stroke: var(--fig-grid, #d7dce3); stroke-width: 1 }
  svg.arthur-fig .lm-text { fill: var(--fig-muted, #6b7480); font: 600 11px system-ui, sans-serif }
  svg.arthur-fig .total { stroke: var(--fig-total, #1f6feb); stroke-width: 2.5; fill: none }
  svg.arthur-fig .alv { stroke: var(--fig-alv, #d1495b); stroke-width: 1.6; fill: none; stroke-dasharray: 6 3 }
  svg.arthur-fig .extra { stroke: var(--fig-extra, #2a9d8f); stroke-width: 1.6; fill: none; stroke-dasharray: 6 3 }
  svg.arthur-fig .nadir { stroke: var(--fig-total, #1f6feb); stroke-width: 1; stroke-dasharray: 3 3 }
  svg.arthur-fig .dot { fill: var(--fig-total, #1f6feb); stroke: none }
  @media (prefers-color-scheme: dark) {
    svg.arthur-fig .axis { stroke: #5b6472 }
    svg.arthur-fig .grid, svg.arthur-fig .lm { stroke: #363d47 }
    svg.arthur-fig .tick, svg.arthur-fig .lm-text { fill: #8b95a3 }
    svg.arthur-fig .label, svg.arthur-fig .title { fill: #d6dbe2 }
    svg.arthur-fig .total, svg.arthur-fig .nadir { stroke: #58a6ff }
    svg.arthur-fig .dot { fill: #58a6ff }
    svg.arthur-fig .alv { stroke: #f08c9a }
    svg.arthur-fig .extra { stroke: #4fd1c1 }
  }
</style>
