<line class="total" style="stroke-dasharray:none" x1="576" y1="48" x2="604" y2="48"/><text class="label" x="610" y="52">incremental</text>
<line class="alv" style="stroke-dasharray:none" x1="576" y1="70" x2="604" y2="70"/><text class="label" x="610" y="74">decremental</text>
<text class="tick" x="576" y="110">only the collapsed but recruitable</text>
